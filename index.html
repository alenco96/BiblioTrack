/* ─── Storage ──────────────────────────────────────────────────── */
const STORAGE_KEY = "bibliotrack-books";
const BACKUP_KEY  = "bibliotrack-last-backup";

function loadBooks() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
  catch { return []; }
}
function saveBooks(books) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(books)); } catch {}
}
function loadLastBackup() {
  try { return localStorage.getItem(BACKUP_KEY) || null; } catch { return null; }
}
function saveLastBackup() {
  try { localStorage.setItem(BACKUP_KEY, new Date().toISOString()); } catch {}
}

/* ─── Constants ────────────────────────────────────────────────── */
const STATUS = {
  READING: "reading", READ: "read", ABANDONED: "abandoned", WISHLIST: "wishlist",
};
const GENRES = [
  "Narrativa","Saggistica","Fantasy","Sci-Fi","Thriller",
  "Horror","Storico","Romanzo","Biografia","Poesia","Fumetti","Altro",
];
const STATUS_MAP = {
  letto: STATUS.READ, in_lettura: STATUS.READING,
  abbandonato: STATUS.ABANDONED, da_leggere: STATUS.WISHLIST,
};
const STATUS_LABELS = {
  [STATUS.READ]: "✅ Letto", [STATUS.READING]: "📖 In lettura",
  [STATUS.ABANDONED]: "❌ Abbandonato", [STATUS.WISHLIST]: "📚 Da leggere",
};

/* ─── Helpers ──────────────────────────────────────────────────── */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

function formatDate(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleDateString("it-IT", { day:"2-digit", month:"short", year:"numeric" });
}

function ratingStars(n) { return "★".repeat(n) + "☆".repeat(5 - n); }

function backupLabel(isoDate) {
  if (!isoDate) return { text:"Nessun backup", urgent:true };
  const days = Math.floor((Date.now() - new Date(isoDate)) / 86400000);
  if (days === 0) return { text:"Backup oggi",          urgent:false };
  if (days === 1) return { text:"Backup ieri",          urgent:false };
  if (days <= 7)  return { text:`Backup ${days} gg fa`, urgent:false };
  return               { text:`Backup ${days} gg fa`, urgent:true  };
}

/* ─── Sort ─────────────────────────────────────────────────────── */
function sortBooks(books, sortBy) {
  const s = [...books];
  switch (sortBy) {
    case "title_asc":   return s.sort((a,b)=>a.title.localeCompare(b.title,"it"));
    case "title_desc":  return s.sort((a,b)=>b.title.localeCompare(a.title,"it"));
    case "author_asc":  return s.sort((a,b)=>a.author.localeCompare(b.author,"it"));
    case "genre":       return s.sort((a,b)=>a.genre.localeCompare(b.genre,"it")||a.title.localeCompare(b.title,"it"));
    case "date_desc":   return s.sort((a,b)=>(b.endDate||b.startDate||"").localeCompare(a.endDate||a.startDate||""));
    case "date_asc":    return s.sort((a,b)=>(a.endDate||a.startDate||"").localeCompare(b.endDate||b.startDate||""));
    case "rating_desc": return s.sort((a,b)=>b.rating-a.rating);
    case "rating_asc":  return s.sort((a,b)=>a.rating-b.rating);
    case "pages_desc":  return s.sort((a,b)=>(parseInt(b.pages)||0)-(parseInt(a.pages)||0));
    case "pages_asc":   return s.sort((a,b)=>(parseInt(a.pages)||0)-(parseInt(b.pages)||0));
    case "saga":        return s.sort((a,b)=>{
      if (!a.saga&&!b.saga) return a.title.localeCompare(b.title,"it");
      if (!a.saga) return 1; if (!b.saga) return -1;
      return a.saga.localeCompare(b.saga,"it")||a.title.localeCompare(b.title,"it");
    });
    default: return s;
  }
}

/* ─── CSV ───────────────────────────────────────────────────────── */
const CSV_COLUMNS = [
  { key:"titolo",      required:true,  desc:"Titolo del libro" },
  { key:"autore",      required:true,  desc:"Nome dell'autore" },
  { key:"genere",      required:false, desc:"Uno tra: "+GENRES.join(", ") },
  { key:"pagine",      required:false, desc:"Numero intero" },
  { key:"stato",       required:true,  desc:"letto | in_lettura | abbandonato | da_leggere" },
  { key:"saga",        required:false, desc:"Nome della saga (es. Empyrean)" },
  { key:"data_inizio", required:false, desc:"AAAA-MM-GG  (es. 2024-03-15)" },
  { key:"data_fine",   required:false, desc:"AAAA-MM-GG  (es. 2024-06-01)" },
  { key:"valutazione", required:false, desc:"Numero da 1 a 5" },
  { key:"note",        required:false, desc:"Testo libero (virgolette se contiene virgole)" },
];

function parseCSV(text) {
  const lines = text.replace(/\r\n/g,"\n").replace(/\r/g,"\n").split("\n").filter(l=>l.trim());
  if (lines.length < 2) return { rows:[], errors:["Il file è vuoto o contiene solo l'intestazione."] };
  function parseLine(line) {
    const result=[]; let cur="", inQ=false;
    for (let i=0; i<line.length; i++) {
      const c=line[i];
      if (c==='"') { inQ=!inQ; continue; }
      if (c==="," && !inQ) { result.push(cur.trim()); cur=""; continue; }
      cur+=c;
    }
    result.push(cur.trim()); return result;
  }
  const headers = parseLine(lines[0]).map(h=>h.toLowerCase().replace(/\s+/g,"_"));
  const rows=[], errors=[];
  lines.slice(1).forEach((line,idx) => {
    if (!line.trim()) return;
    const lineNum=idx+2, vals=parseLine(line), obj={};
    headers.forEach((h,i) => { obj[h]=vals[i]||""; });
    const missing = CSV_COLUMNS.filter(c=>c.required&&!obj[c.key]);
    if (missing.length) { errors.push(`Riga ${lineNum}: campi obbligatori mancanti (${missing.map(c=>c.key).join(", ")})`); return; }
    const status = STATUS_MAP[(obj.stato||"").toLowerCase().replace(/\s+/g,"_")];
    if (!status) { errors.push(`Riga ${lineNum}: valore "stato" non valido → "${obj.stato}"`); return; }
    rows.push({
      id:uid(), title:obj.titolo, author:obj.autore,
      genre:GENRES.includes(obj.genere)?obj.genere:"Altro",
      pages:obj.pagine||"", status, saga:obj.saga||"",
      startDate:obj.data_inizio||"", endDate:obj.data_fine||"",
      rating:Math.min(5,Math.max(0,parseInt(obj.valutazione)||0)),
      notes:obj.note||"",
    });
  });
  return { rows, errors };
}

function exportBackupCSV(books) {
  const STATUS_REV = { reading:"in_lettura", read:"letto", abandoned:"abbandonato", wishlist:"da_leggere" };
  const esc = v => (String(v||"").includes(",") || String(v||"").includes('"'))
    ? `"${String(v).replace(/"/g,'""')}"` : String(v||"");
  const header = "titolo,autore,genere,pagine,stato,saga,data_inizio,data_fine,valutazione,note";
  const rows = books.map(b=>[
    b.title,b.author,b.genre,b.pages,STATUS_REV[b.status]||b.status,
    b.saga||"",b.startDate,b.endDate,b.rating||"",b.notes,
  ].map(esc).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([header+"\n"+rows],{type:"text/csv;charset=utf-8;"}));
  a.download = `bibliotrack_backup_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); saveLastBackup();
}

function downloadTemplate() {
  const header = "titolo,autore,genere,pagine,stato,saga,data_inizio,data_fine,valutazione,note";

function bookColor(title) {
  const PALETTE = ["#4A7FA5","#5A8A5A","#8A5A8A","#A57A4A","#7A2233","#4A5A8A","#8A7A4A","#5A7A6A"];
  let h = 0;
  for (let i = 0; i < title.length; i++) h = (h * 31 + title.charCodeAt(i)) & 0xffffffff;
  return PALETTE[Math.abs(h) % PALETTE.length];
}

function ReadingCalendar({ books }) {
  const booksWithDates = books.filter(b=>b.startDate&&
    (b.status===STATUS.READING||b.status===STATUS.READ||b.status===STATUS.ABANDONED));
  const [viewDate,setViewDate] = useState(new Date());
  const [selectedDay,setSelectedDay] = useState(null);
  const year=viewDate.getFullYear(), month=viewDate.getMonth();
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const today=new Date();
  const todayMid=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  const MONTHS=["gennaio","febbraio","marzo","aprile","maggio","giugno",
    "luglio","agosto","settembre","ottobre","novembre","dicembre"];
  const DAYS=["Do","Lu","Ma","Me","Gi","Ve","Sa"];

  function booksOnDay(day) {
    const d=new Date(year,month,day);
    return booksWithDates.filter(b=>{
      const start=new Date(b.startDate);
      const startMid=new Date(start.getFullYear(),start.getMonth(),start.getDate());
      const endMid=b.endDate
        ?new Date(new Date(b.endDate).getFullYear(),new Date(b.endDate).getMonth(),new Date(b.endDate).getDate())
        :todayMid;
      return d>=startMid&&d<=endMid;
    });
  }

  const activeDays=new Set();
  for(let d=1;d<=daysInMonth;d++){if(booksOnDay(d).length>0)activeDays.add(d);}

  return (
    <>
      <div style={{background:"var(--card-bg)",borderRadius:16,padding:"1.1rem 1rem",
        boxShadow:"0 1px 4px rgba(28,22,17,0.07)"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"1rem"}}>
          <button onClick={()=>setViewDate(new Date(year,month-1,1))} style={{background:"none",
            border:"none",cursor:"pointer",color:"var(--muted)",fontSize:"1.1rem",padding:"0.2rem 0.5rem"}}>‹</button>
          <span style={{fontFamily:"'Lora',serif",fontWeight:600,fontSize:"0.95rem",color:"var(--ink)"}}>
            {MONTHS[month]} {year}
          </span>
          <button onClick={()=>setViewDate(new Date(year,month+1,1))} style={{background:"none",
            border:"none",cursor:"pointer",color:"var(--muted)",fontSize:"1.1rem",padding:"0.2rem 0.5rem"}}>›</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",marginBottom:"0.4rem"}}>
          {DAYS.map(d=>(
            <div key={d} style={{textAlign:"center",fontFamily:"'DM Mono',monospace",
              fontSize:"0.65rem",color:"var(--muted)",padding:"0.2rem 0",textTransform:"uppercase"}}>{d}</div>
          ))}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"2px"}}>
          {Array.from({length:firstDay},(_,i)=><div key={"e"+i}/>)}
          {Array.from({length:daysInMonth},(_,i)=>{
            const day=i+1;
            const isToday=today.getFullYear()===year&&today.getMonth()===month&&today.getDate()===day;
            const dayBooks=booksOnDay(day);
            const hasReading=dayBooks.length>0;
            const bookCol=hasReading?bookColor(dayBooks[0].title):null;
            const hexToRgba=(hex,a)=>{
              const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
              return `rgba(${r},${g},${b},${a})`;
            };
            const bg=isToday?"var(--burgundy)":hasReading?hexToRgba(bookCol,0.18):"transparent";
            return (
              <div key={day} onClick={()=>{if(hasReading)setSelectedDay({day,books:dayBooks});}}
                style={{aspectRatio:"1",display:"flex",alignItems:"center",justifyContent:"center",
                  borderRadius:"50%",background:bg,position:"relative",
                  cursor:hasReading?"pointer":"default"}}>
                <span style={{fontFamily:"'DM Mono',monospace",fontSize:"0.75rem",userSelect:"none",
                  color:isToday?"#fff":hasReading?bookCol:"var(--ink)",
                  fontWeight:isToday||hasReading?600:400}}>
                  {day}
                </span>
                {hasReading&&!isToday&&(
                  <span style={{position:"absolute",bottom:3,left:"50%",transform:"translateX(-50%)",
                    width:4,height:4,borderRadius:"50%",background:bookCol}}/>
                )}
              </div>
            );
          })}
        </div>
        {booksWithDates.length===0&&(
          <div style={{textAlign:"center",color:"var(--muted)",fontStyle:"italic",padding:"1rem 0 0",fontSize:"0.85rem"}}>
            Aggiungi le date di lettura per vederle sul calendario
          </div>
        )}
      </div>

      {selectedDay&&(
        <div onClick={()=>setSelectedDay(null)}
          style={{position:"fixed",inset:0,background:"rgba(28,22,17,0.45)",
            display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:500,backdropFilter:"blur(2px)"}}>
          <div onClick={e=>e.stopPropagation()}
            style={{background:"var(--bg)",borderRadius:"20px 20px 0 0",width:"100%",maxWidth:520,
              boxShadow:"0 -8px 40px rgba(28,22,17,0.2)",paddingBottom:"env(safe-area-inset-bottom,1.5rem)"}}>
            <div style={{display:"flex",justifyContent:"center",padding:"0.75rem 0 0.5rem"}}>
              <div style={{width:36,height:4,borderRadius:2,background:"var(--border)"}}/>
            </div>
            <div style={{padding:"0 1.25rem 1.25rem"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1rem"}}>
                <h3 style={{fontFamily:"'Playfair Display',serif",fontSize:"1.2rem",fontWeight:700,color:"var(--ink)"}}>
                  {selectedDay.day} {MONTHS[month]} {year}
                </h3>
                <button onClick={()=>setSelectedDay(null)} style={{background:"none",border:"none",
                  cursor:"pointer",color:"var(--muted)",fontSize:"1.3rem",padding:"0.2rem"}}>✕</button>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:"0.65rem"}}>
                {selectedDay.books.map(b=>(
                  <div key={b.id} style={{background:"var(--card-bg)",borderRadius:12,
                    padding:"0.85rem 1rem",display:"flex",alignItems:"center",gap:"0.85rem",
                    boxShadow:"0 1px 4px rgba(28,22,17,0.07)"}}>
                    <div style={{width:44,height:44,borderRadius:9,background:bookColor(b.title),flexShrink:0,
                      display:"flex",alignItems:"center",justifyContent:"center",
                      fontFamily:"'Playfair Display',serif",fontSize:"1.2rem",fontWeight:700,color:"#fff"}}>
                      {b.title.charAt(0).toUpperCase()}
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontFamily:"'Lora',serif",fontWeight:600,fontSize:"0.95rem",
                        color:"var(--ink)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                        {b.title}
                      </div>
                      <div style={{fontSize:"0.8rem",color:"var(--muted)",marginTop:"0.1rem"}}>{b.author}</div>
                      <div style={{fontSize:"0.72rem",fontFamily:"'DM Mono',monospace",color:"var(--muted)",marginTop:"0.2rem"}}>
                        {b.startDate}{b.endDate?" → "+b.endDate:""}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

function Statistics({ books }) {
  const read = books.filter(b => b.status === STATUS.READ);
  const thisYear = new Date().getFullYear();
  const readThisYear = read.filter(b => b.endDate && new Date(b.endDate).getFullYear() === thisYear);
  const totalPages = read.reduce((s, b) => s + (parseInt(b.pages) || 0), 0);
  const avgRating = read.filter(b=>b.rating>0).length
    ? (read.filter(b=>b.rating>0).reduce((s,b)=>s+b.rating,0)/read.filter(b=>b.rating>0).length).toFixed(1)
    : null;

  const genreCounts = {};
  read.forEach(b => { genreCounts[b.genre] = (genreCounts[b.genre]||0)+1; });
  const sortedGenres = Object.entries(genreCounts).sort((a,b)=>b[1]-a[1]);
  const favGenre = sortedGenres[0]?.[0] || null;
  const maxGenre = sortedGenres[0]?.[1] || 1;

  const longestBook = read.reduce((best,b)=>{
    const p=parseInt(b.pages)||0;
    return p>(parseInt(best?.pages)||0)?b:best;
  }, null);

  const MONTH_LABELS = ["G","F","M","A","M","G","L","A","S","O","N","D"];
  const byMonth = Array(12).fill(0);
  readThisYear.forEach(b => {
    if(b.endDate) byMonth[new Date(b.endDate).getMonth()]++;
  });
  const maxMonth = Math.max(...byMonth, 1);

  const sagaCounts = {};
  books.forEach(b => { if(b.saga) sagaCounts[b.saga]=(sagaCounts[b.saga]||0)+1; });
  const topSagas = Object.entries(sagaCounts).sort((a,b)=>b[1]-a[1]).slice(0,3);

  const cardBase = {
    background:"#fff", border:"1px solid rgba(200,187,168,0.5)",
    borderRadius:16, padding:"1.1rem 1rem",
    display:"flex", flexDirection:"column", gap:"0.3rem",
  };
  const cardHighlight = { ...cardBase, background:"var(--burgundy)", border:"none" };
  const labelStyle = { fontFamily:"'DM Mono',monospace", fontSize:"0.72rem", color:"var(--muted)",
    textTransform:"uppercase", letterSpacing:"0.06em" };
  const labelStyleLight = { ...labelStyle, color:"rgba(255,255,255,0.75)" };
  const valueStyle = { fontFamily:"'Playfair Display',serif", fontSize:"1.9rem", fontWeight:700,
    color:"var(--ink)", lineHeight:1.1 };
  const valueStyleLight = { ...valueStyle, color:"#fff" };
  const sectionCard = { background:"#fff", border:"1px solid rgba(200,187,168,0.5)", borderRadius:16, padding:"1.25rem" };

  return (
    <div style={{display:"flex",flexDirection:"column",gap:"1rem"}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0.75rem"}}>
        <div style={cardHighlight}>
          <div style={valueStyleLight}>{read.length}</div>
          <div style={labelStyleLight}>Libri letti</div>
        </div>
        <div style={cardBase}>
          <div style={valueStyle}>{readThisYear.length}</div>
          <div style={labelStyle}>Quest'anno</div>
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0.75rem"}}>
        <div style={cardBase}>
          <div style={{...valueStyle,fontSize:"1.5rem"}}>{totalPages>0?totalPages.toLocaleString("it"):"—"}</div>
          <div style={labelStyle}>Pagine lette</div>
        </div>
        <div style={cardBase}>
          <div style={{...valueStyle,fontSize:"1.5rem"}}>{avgRating||"—"}</div>
          <div style={labelStyle}>Voto medio</div>
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0.75rem"}}>
        <div style={cardBase}>
          <div style={{...valueStyle,fontSize:favGenre&&favGenre.length>8?"1.1rem":"1.5rem"}}>{favGenre||"—"}</div>
          <div style={labelStyle}>Genere fav.</div>
        </div>
        <div style={cardBase}>
          <div style={{...valueStyle,fontSize:longestBook?"0.92rem":"1.5rem",
            overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>
            {longestBook?longestBook.title:"—"}
          </div>
          <div style={labelStyle}>Libro più lungo</div>
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"0.6rem"}}>
        {[
          { value:books.filter(b=>b.status===STATUS.READING).length, label:"In lettura" },
          { value:books.filter(b=>b.status===STATUS.WISHLIST).length, label:"Da leggere" },
          { value:books.length, label:"Totale" },
        ].map(({value,label})=>(
          <div key={label} style={{...cardBase,alignItems:"center",textAlign:"center",padding:"0.9rem 0.5rem"}}>
            <div style={{...valueStyle,fontSize:"1.5rem"}}>{value}</div>
            <div style={labelStyle}>{label}</div>
          </div>
        ))}
      </div>

      <div style={sectionCard}>
        <h4 style={{fontFamily:"'Playfair Display',serif",fontSize:"1rem",fontWeight:700,marginBottom:"1rem"}}>
          Libri al mese ({thisYear})
        </h4>
        <div style={{display:"flex",alignItems:"flex-end",gap:"4px",height:80}}>
          {byMonth.map((count,i)=>(
            <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
              <div style={{width:"100%",height:count>0?`${Math.max(8,(count/maxMonth)*64)}px`:"0px",
                background:"var(--burgundy)",borderRadius:"3px 3px 0 0",transition:"height 0.3s"}}/>
              <div style={{fontFamily:"'DM Mono',monospace",fontSize:"0.58rem",color:"var(--muted)",marginTop:2}}>
                {MONTH_LABELS[i]}
              </div>
            </div>
          ))}
        </div>
      </div>

      {sortedGenres.length>0&&(
        <div style={sectionCard}>
          <h4 style={{fontFamily:"'Playfair Display',serif",fontSize:"1rem",fontWeight:700,marginBottom:"1rem"}}>Per genere</h4>
          {sortedGenres.map(([g,c])=>(
            <div key={g} style={{display:"flex",alignItems:"center",gap:"0.75rem",marginBottom:"0.6rem"}}>
              <span style={{fontFamily:"'Lora',serif",fontSize:"0.85rem",minWidth:80,color:"var(--ink)"}}>{g}</span>
              <div style={{flex:1,height:6,background:"rgba(200,187,168,0.3)",borderRadius:3,overflow:"hidden"}}>
                <div style={{height:"100%",width:`${(c/maxGenre)*100}%`,background:"var(--burgundy)",borderRadius:3}}/>
              </div>
              <span style={{fontFamily:"'DM Mono',monospace",fontSize:"0.72rem",color:"var(--muted)",minWidth:12,textAlign:"right"}}>{c}</span>
            </div>
          ))}
        </div>
      )}

      {topSagas.length>0&&(
        <div style={sectionCard}>
          <h4 style={{fontFamily:"'Playfair Display',serif",fontSize:"1rem",fontWeight:700,marginBottom:"1rem"}}>Top Saghe</h4>
          {topSagas.map(([name,count])=>(
            <div key={name} style={{display:"flex",alignItems:"center",gap:"0.75rem",marginBottom:"0.6rem",
              padding:"0.6rem 0",borderBottom:"1px solid rgba(200,187,168,0.3)"}}>
              <span style={{fontFamily:"'Lora',serif",fontSize:"0.9rem",fontWeight:600,flex:1,color:"var(--ink)"}}>{name}</span>
              <span style={{fontFamily:"'DM Mono',monospace",fontSize:"0.72rem",color:"var(--muted)"}}>{count} {count===1?"libro":"libri"}</span>
            </div>
          ))}
        </div>
      )}

      {books.length===0&&(
        <div style={{textAlign:"center",color:"var(--muted)",fontStyle:"italic",padding:"2.5rem",
          background:"#fff",borderRadius:16,border:"1px solid rgba(200,187,168,0.5)"}}>
          Le statistiche appariranno man mano che aggiungi libri letti
        </div>
      )}
    </div>
  );
}

function BookList({ books, onEdit, onDelete, sortBy }) {
  const sorted=sortBooks(books,sortBy);
  if(sorted.length===0) return (
    <div style={{textAlign:"center",color:"var(--muted)",fontStyle:"italic",padding:"2rem",
      background:"var(--parchment)",border:"1px solid var(--border)",borderRadius:4}}>
      Nessun libro in questa categoria.
    </div>
  );
  return <div style={{display:"grid",gap:"0.75rem"}}>{sorted.map(b=><BookCard key={b.id} book={b} onEdit={onEdit} onDelete={onDelete}/>)}</div>;
}

function OpenLibrarySearchModal({ onSelectBook, onClose }) {
  const [query, setQuery] = useState("");
  const [risultati, setRisultati] = useState([]);
  const [caricamento, setCaricamento] = useState(false);
  const [cercato, setCercato] = useState(false);

  async function cercaLibri(searchQuery) {
    if (!searchQuery.trim()) return;
    setCaricamento(true);
    try {
      const response = await fetch(
        `https://openlibrary.org/search.json?title=${encodeURIComponent(searchQuery)}&limit=8`
      );
      const data = await response.json();
      const libri = data.docs.map(libro => ({
        title: libro.title || "",
        author: libro.author_name?.[0] || "",
        genre: libro.subject?.[0] || "Altro",
        pages: libro.number_of_pages_median || "",
        isbn: libro.isbn?.[0] || "",
        copertina: libro.cover_i 
          ? `https://covers.openlibrary.org/b/id/${libro.cover_i}-S.jpg`
          : null,
      }));
      setRisultati(libri);
      setCercato(true);
    } catch (error) {
      console.error("Errore ricerca:", error);
      setRisultati([]);
    } finally {
      setCaricamento(false);
    }
  }

  const handleCerca = (e) => {
    e.preventDefault();
    cercaLibri(query);
  };

  const inp = {
    width: "100%", padding: "0.85rem 1rem",
    background: "var(--card-bg)", border: "1px solid var(--border)",
    borderRadius: 12, fontFamily: "'Lora',serif",
    fontSize: "0.95rem", color: "var(--ink)", outline: "none",
  };
  const lbl = {
    display: "block", fontSize: "0.68rem", fontFamily: "'DM Mono',monospace",
    textTransform: "uppercase", letterSpacing: "0.1em",
    color: "var(--muted)", marginBottom: "0.4rem", fontWeight: 500,
  };

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1.25rem",marginTop:"0.25rem"}}>
        <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:"1.5rem",fontWeight:700,color:"var(--ink)"}}>
          Cerca su Open Library
        </h2>
        <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",color:"var(--muted)",fontSize:"1.3rem",lineHeight:1,padding:"0.2rem"}}>✕</button>
      </div>

      <form onSubmit={handleCerca} style={{marginBottom:"1.5rem",display:"flex",gap:"0.5rem"}}>
        <div style={{flex:1}}>
          <span style={lbl}>Titolo o autore</span>
          <input
            style={inp}
            type="text"
            placeholder="Es: Fourth Wing, Rebecca Yarros..."
            value={query}
            onChange={(e) => setQuery(e.target.value)}
          />
        </div>
        <button
          type="submit"
          disabled={caricamento}
          style={{
            alignSelf:"flex-end",
            padding:"0.85rem 1.2rem",
            background:"var(--burgundy)",
            color:"#fff",
            border:"none",
            borderRadius:12,
            cursor:caricamento?"default":"pointer",
            fontFamily:"'Lora',serif",
            fontSize:"0.95rem",
            fontWeight:600,
            opacity:caricamento?0.7:1,
          }}
        >
          {caricamento?"...":"Cerca"}
        </button>
      </form>

      {cercato&&risultati.length===0&&(
        <div style={{textAlign:"center",color:"var(--muted)",fontStyle:"italic",padding:"1.5rem"}}>
          Nessun risultato trovato. Prova un'altra ricerca.
        </div>
      )}

      <div style={{display:"flex",flexDirection:"column",gap:"0.75rem",maxHeight:"320px",overflowY:"auto",marginBottom:"1rem"}}>
        {risultati.map((libro,idx)=>(
          <div
            key={idx}
            style={{
              background:"var(--card-bg)",
              borderRadius:12,
              padding:"0.9rem",
              display:"flex",
              gap:"0.85rem",
              alignItems:"flex-start",
              border:"1px solid var(--border)",
              cursor:"pointer",
            }}
            onClick={()=>onSelectBook(libro)}
          >
            {libro.copertina&&(
              <img
                src={libro.copertina}
                alt={libro.title}
                style={{width:40,height:56,borderRadius:6,objectFit:"cover",flexShrink:0}}
              />
            )}
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:600,fontSize:"0.95rem",color:"var(--ink)",marginBottom:"0.2rem",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                {libro.title}
              </div>
              <div style={{fontSize:"0.8rem",color:"var(--muted)",marginBottom:"0.3rem",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                {libro.author}
              </div>
              <div style={{fontSize:"0.72rem",color:"var(--muted)"}}>
                {libro.genre} {libro.pages?`• ${libro.pages} pag.`:""}
              </div>
            </div>
            <div style={{fontSize:"1.2rem",color:"var(--muted)",flexShrink:0}}>→</div>
          </div>
        ))}
      </div>

      <button
        onClick={onClose}
        style={{
          width:"100%",
          padding:"0.9rem",
          background:"none",
          border:"1.5px solid var(--border)",
          borderRadius:14,
          cursor:"pointer",
          fontFamily:"'Lora',serif",
          fontSize:"0.95rem",
          color:"var(--muted)",
        }}
      >
        Annulla
      </button>
    </div>
  );
}

function CsvImportModal({ onImport, onClose, existingBooks }) {
  const [stage,setStage]=useState("guide");
  const [parsed,setParsed]=useState({rows:[],errors:[]});
  const [mode,setMode]=useState("skip");
  const [dragging,setDragging]=useState(false);
  const mono={fontFamily:"'DM Mono',monospace"};
  const lbl={display:"block",fontSize:"0.68rem",...mono,textTransform:"uppercase",
    letterSpacing:"0.1em",color:"var(--muted)",marginBottom:"0.4rem",fontWeight:500};

  function handleFile(file) {
    if(!file)return;
    const r=new FileReader();
    r.onload=e=>{setParsed(parseCSV(e.target.result));setStage("preview");};
    r.readAsText(file,"UTF-8");
  }
  function doImport() {
    const existing=new Set(existingBooks.map(b=>b.title.toLowerCase()+"||"+b.author.toLowerCase()));
    let added=0,skipped=0;
    const newBooks=[...existingBooks];
    parsed.rows.forEach(row=>{
      const key=row.title.toLowerCase()+"||"+row.author.toLowerCase();
      if(existing.has(key)){
        if(mode==="overwrite"){
          const idx=newBooks.findIndex(b=>b.title.toLowerCase()===row.title.toLowerCase()&&b.author.toLowerCase()===row.author.toLowerCase());
          if(idx>=0){newBooks[idx]={...newBooks[idx],...row,id:newBooks[idx].id};added++;}
        } else skipped++;
      } else {newBooks.push(row);existing.add(key);added++;}
    });
    onImport(newBooks,added,skipped);
  }

  const inp = {
    width:"100%",padding:"0.75rem 1rem",background:"var(--card-bg)",
    border:"1px solid var(--border)",borderRadius:12,fontFamily:"'Lora',serif",
    fontSize:"0.9rem",color:"var(--ink)",outline:"none",
  };

  if(stage==="guide") return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1.25rem",marginTop:"0.25rem"}}>
        <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:"1.5rem",fontWeight:700,color:"var(--ink)"}}>Importa CSV</h2>
        <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",
          color:"var(--muted)",fontSize:"1.3rem",lineHeight:1,padding:"0.2rem"}}>✕</button>
      </div>

      <div style={{background:"var(--card-bg)",borderRadius:14,overflow:"hidden",
        boxShadow:"0 1px 4px rgba(28,22,17,0.07)",marginBottom:"1rem"}}>
        <div style={{padding:"0.6rem 1rem",background:"var(--ink)",display:"grid",
          gridTemplateColumns:"1fr 0.5fr 2fr",gap:"0.5rem"}}>
          {["Colonna","Obbl.","Valori accettati"].map(h=>(
            <span key={h} style={{...mono,fontSize:"0.6rem",color:"rgba(255,255,255,0.6)",
              textTransform:"uppercase",letterSpacing:"0.08em"}}>{h}</span>
          ))}
        </div>
        {CSV_COLUMNS.map((c,i)=>(
          <div key={c.key} style={{padding:"0.55rem 1rem",display:"grid",gridTemplateColumns:"1fr 0.5fr 2fr",
            gap:"0.5rem",alignItems:"start",
            background:i%2===0?"var(--card-bg)":"rgba(242,237,228,0.5)",
            borderTop:"1px solid var(--border)"}}>
            <code style={{...mono,fontSize:"0.78rem",color:"var(--burgundy)",fontWeight:500}}>{c.key}</code>
            <span style={{...mono,fontSize:"0.7rem",color:c.required?"#4CAF50":"var(--muted)"}}>{c.required?"Sì":"—"}</span>
            <span style={{fontSize:"0.75rem",color:"var(--muted)",lineHeight:1.4}}>{c.desc}</span>
          </div>
        ))}
      </div>

      <button onClick={downloadTemplate} style={{width:"100%",padding:"0.75rem",marginBottom:"1rem",
        background:"var(--card-bg)",border:"1.5px dashed var(--border)",borderRadius:12,cursor:"pointer",
        fontFamily:"'Lora',serif",fontSize:"0.88rem",color:"var(--muted)"}}>
        ⬇ Scarica file CSV di esempio
      </button>

      <div onDragOver={e=>{e.preventDefault();setDragging(true);}} onDragLeave={()=>setDragging(false)}
        onDrop={e=>{e.preventDefault();setDragging(false);handleFile(e.dataTransfer.files[0]);}}
        style={{border:`2px dashed ${dragging?"var(--burgundy)":"var(--border)"}`,borderRadius:14,
          padding:"2rem 1rem",textAlign:"center",cursor:"pointer",marginBottom:"1.25rem",
          background:dragging?"rgba(122,34,51,0.05)":"var(--card-bg)",transition:"all 0.2s"}}
        onClick={()=>document.getElementById("csv-input").click()}>
        <div style={{fontSize:"2rem",marginBottom:"0.5rem"}}>📂</div>
        <div style={{fontFamily:"'Lora',serif",fontSize:"0.9rem",color:"var(--muted)"}}>
          Trascina il CSV qui, o <span style={{color:"var(--burgundy)",textDecoration:"underline"}}>selezionalo</span>
        </div>
        <input id="csv-input" type="file" accept=".csv,text/csv" style={{display:"none"}}
          onChange={e=>handleFile(e.target.files[0])}/>
      </div>

      <button onClick={onClose} style={{width:"100%",padding:"0.9rem",background:"none",
        border:"1.5px solid var(--border)",borderRadius:14,cursor:"pointer",
        fontFamily:"'Lora',serif",fontSize:"0.95rem",color:"var(--muted)"}}>Annulla</button>
    </div>
  );

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"0.5rem",marginTop:"0.25rem"}}>
        <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:"1.5rem",fontWeight:700,color:"var(--ink)"}}>Anteprima</h2>
        <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",
          color:"var(--muted)",fontSize:"1.3rem",lineHeight:1,padding:"0.2rem"}}>✕</button>
      </div>
      <p style={{fontSize:"0.82rem",color:"var(--muted)",marginBottom:"1rem",fontStyle:"italic"}}>
        {parsed.rows.length} libro/i pronti · {parsed.errors.length} errore/i
      </p>

      {parsed.errors.length>0&&(
        <div style={{background:"rgba(122,34,51,0.07)",border:"1px solid rgba(122,34,51,0.3)",borderRadius:12,
          padding:"0.85rem 1rem",marginBottom:"1rem",fontSize:"0.78rem",color:"var(--burgundy)",lineHeight:1.7,...mono}}>
          {parsed.errors.map((e,i)=><div key={i}>⚠ {e}</div>)}
        </div>
      )}

      {parsed.rows.length>0&&(
        <>
          <div style={{marginBottom:"1rem"}}>
            <span style={lbl}>Se il libro esiste già</span>
            <div style={{display:"flex",gap:"0.5rem"}}>
              {[["skip","Salta duplicato"],["overwrite","Sovrascrivi"]].map(([v,l])=>(
                <button key={v} onClick={()=>setMode(v)} style={{
                  padding:"0.5rem 1rem",borderRadius:20,cursor:"pointer",...mono,fontSize:"0.72rem",
                  textTransform:"uppercase",letterSpacing:"0.05em",border:"none",
                  background:mode===v?"var(--burgundy)":"var(--card-bg)",
                  color:mode===v?"#fff":"var(--muted)",fontWeight:mode===v?600:400,
                }}>{l}</button>
              ))}
            </div>
          </div>

          <div style={{maxHeight:220,overflowY:"auto",borderRadius:12,marginBottom:"1.25rem",
            border:"1px solid var(--border)"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:"0.78rem"}}>
              <thead>
                <tr style={{background:"var(--ink)"}}>
                  {["Titolo","Autore","Stato","Val."].map(h=>(
                    <th key={h} style={{...mono,padding:"0.5rem 0.75rem",textAlign:"left",
                      color:"rgba(255,255,255,0.7)",fontSize:"0.62rem",
                      textTransform:"uppercase",letterSpacing:"0.07em",fontWeight:500}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {parsed.rows.map((r,i)=>{
                  const dup=existingBooks.some(b=>b.title.toLowerCase()===r.title.toLowerCase()&&b.author.toLowerCase()===r.author.toLowerCase());
                  return (
                    <tr key={r.id} style={{background:i%2===0?"var(--card-bg)":"rgba(242,237,228,0.5)",borderTop:"1px solid var(--border)"}}>
                      <td style={{padding:"0.5rem 0.75rem",fontFamily:"'Lora',serif",maxWidth:130,
                        overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                        {dup&&<span style={{color:"var(--amber)",marginRight:3}}>⚠</span>}{r.title}
                      </td>
                      <td style={{padding:"0.5rem 0.75rem",color:"var(--muted)",fontStyle:"italic",
                        maxWidth:100,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.author}</td>
                      <td style={{padding:"0.5rem 0.75rem",...mono,fontSize:"0.68rem",color:"var(--muted)"}}>{STATUS_LABELS[r.status]}</td>
                      <td style={{padding:"0.5rem 0.75rem",color:"var(--amber)",letterSpacing:"-1px"}}>{r.rating>0?ratingStars(r.rating):"—"}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </>
      )}

      <div style={{display:"flex",flexDirection:"column",gap:"0.6rem"}}>
        {parsed.rows.length>0&&(
          <button onClick={doImport} style={{width:"100%",padding:"1rem",
            background:"var(--burgundy)",color:"#fff",border:"none",borderRadius:14,
            cursor:"pointer",fontFamily:"'Lora',serif",fontSize:"1rem",fontWeight:600}}>
            Importa {parsed.rows.length} libro/i
          </button>
        )}
        <div style={{display:"flex",gap:"0.6rem"}}>
          <button onClick={()=>setStage("guide")} style={{flex:1,padding:"0.75rem",background:"none",
            border:"1.5px solid var(--border)",borderRadius:14,cursor:"pointer",
            fontFamily:"'Lora',serif",color:"var(--muted)",fontSize:"0.88rem"}}>← Indietro</button>
          <button onClick={onClose} style={{flex:1,padding:"0.75rem",background:"none",
            border:"1.5px solid var(--border)",borderRadius:14,cursor:"pointer",
            fontFamily:"'Lora',serif",color:"var(--muted)",fontSize:"0.88rem"}}>Annulla</button>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════
   MAIN APP
══════════════════════════════════════════════════════════════════ */
function BiblioTrack() {
  const [books,     setBooks]           = useState(()=>loadBooks());
  const [tab,       setTab]             = useState("home");
  const [modal,     setModal]           = useState(null);
  const [csvModal,  setCsvModal]        = useState(false);
  const [openLibraryModal, setOpenLibraryModal] = useState(false);
  const [openLibraryPreload, setOpenLibraryPreload] = useState(null);
  const [toast,     setToast]           = useState(null);
  const [lastBackup,setLastBackup]      = useState(()=>loadLastBackup());

  const persist = useCallback(next=>{setBooks(next);saveBooks(next);},[]);

  const handleOpenLibrarySelect = (libroData) => {
    setOpenLibraryPreload(libroData);
    setOpenLibraryModal(false);
    setModal("add");
  };

  const saveBook = book => {
    persist(books.some(b=>b.id===book.id)?books.map(b=>b.id===book.id?book:b):[...books,book]);
    setModal(null);
  };
  const deleteBook = id => { if(confirm("Eliminare questo libro?")) persist(books.filter(b=>b.id!==id)); };
  const handleCsvImport = (newBooks,added,skipped) => {
    persist(newBooks); setCsvModal(false);
    setToast(`✅ ${added} libro/i importati${skipped>0?`, ${skipped} saltati`:""}.`);
    setTimeout(()=>setToast(null),4000);
  };
  const doBackup = () => {
    exportBackupCSV(books);
    setLastBackup(new Date().toISOString());
    setToast("💾 Backup esportato con successo.");
    setTimeout(()=>setToast(null),3500);
  };

  const reading = books.filter(b=>b.status===STATUS.READING);
  const wishlist = books.filter(b=>b.status===STATUS.WISHLIST);
  const hour = new Date().getHours();
  const greeting = hour < 12 ? "Buongiorno" : hour < 18 ? "Buon pomeriggio" : "Buonasera";
  const {text:backupText, urgent:backupUrgent} = backupLabel(lastBackup);

  const TABS = [
    {id:"home",     label:"Home"},
    {id:"library",  label:"Libreria"},
    {id:"wishlist", label:"Da leggere"},
    {id:"stats",    label:"Statistiche"},
  ];

  const TAB_ICONS = {
    home: <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
    library: <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>,
    wishlist: <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>,
    stats: <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>,
  };

  return (
    <>
      <FontLink/>
      <div style={{minHeight:"100vh",background:"var(--bg)",paddingBottom:"5rem",paddingTop:"max(0px, env(safe-area-inset-top))",maxWidth:520,margin:"0 auto"}}>
        <main style={{padding:"1.5rem 1.1rem 0"}}>

          {tab==="home"&&(
            <div style={{display:"flex",flexDirection:"column",gap:"1.25rem"}}>
              <div>
                <div style={{fontFamily:"'Lora',serif",fontSize:"0.9rem",color:"var(--muted)"}}>{greeting}</div>
                <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:"1.9rem",fontWeight:700,
                  color:"var(--ink)",lineHeight:1.15}}>Calendario letture</h1>
              </div>
              <ReadingCalendar books={books}/>
              <div>
                <div style={{fontFamily:"'Lora',serif",fontWeight:700,fontSize:"1rem",
                  color:"var(--ink)",marginBottom:"0.6rem"}}>In lettura ora</div>
                {reading.length===0
                  ?<div style={{background:"var(--card-bg)",borderRadius:14,padding:"1.1rem",
                      textAlign:"center",color:"var(--muted)",fontStyle:"italic",fontSize:"0.85rem",
                      boxShadow:"0 1px 4px rgba(28,22,17,0.06)"}}>
                      Nessun libro in lettura.{" "}
                      <button onClick={()=>setModal("add")} style={{background:"none",border:"none",
                        color:"var(--burgundy)",cursor:"pointer",fontFamily:"'Lora',serif",
                        fontStyle:"italic",fontSize:"inherit"}}>Aggiungine uno →</button>
                    </div>
                  :<div style={{display:"flex",flexDirection:"column",gap:"0.5rem"}}>
                    {reading.map(b=><BookCard key={b.id} book={b} onEdit={b=>setModal(b)} onDelete={deleteBook}/>)}
                  </div>
                }
              </div>
            </div>
          )}

          {tab==="library"&&(
            <LibrarySection books={books} onEdit={b=>setModal(b)} onDelete={deleteBook}
              onAdd={()=>setModal("add")} onCsvImport={()=>setCsvModal(true)}
              onBackup={doBackup} backupText={backupText} backupUrgent={backupUrgent}/>
          )}

          {tab==="wishlist"&&(
            <div style={{display:"flex",flexDirection:"column",gap:"0.75rem"}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:"1.9rem",fontWeight:700,color:"var(--ink)"}}>Da leggere</h1>
                <span style={{background:"rgba(122,34,51,0.12)",color:"var(--burgundy)",
                  fontFamily:"'DM Mono',monospace",fontSize:"0.72rem",fontWeight:600,
                  borderRadius:20,padding:"0.15rem 0.65rem"}}>{wishlist.length}</span>
              </div>
              {wishlist.length===0
                ?<div style={{background:"var(--card-bg)",borderRadius:14,padding:"2rem 1rem",
                    textAlign:"center",color:"var(--muted)",fontStyle:"italic",fontSize:"0.88rem",
                    boxShadow:"0 1px 4px rgba(28,22,17,0.06)"}}>
                    La tua lista è vuota.{" "}
                    <button onClick={()=>setModal("add")} style={{background:"none",border:"none",
                      color:"var(--burgundy)",cursor:"pointer",fontFamily:"'Lora',serif",
                      fontStyle:"italic",fontSize:"inherit"}}>Aggiungine uno →</button>
                  </div>
                :<div style={{display:"flex",flexDirection:"column",gap:"0.5rem"}}>
                    {wishlist.map(b=><BookCard key={b.id} book={b} onEdit={b=>setModal(b)} onDelete={deleteBook}/>)}
                  </div>
              }
            </div>
          )}

          {tab==="stats"&&(
            <div style={{display:"flex",flexDirection:"column",gap:"0.75rem"}}>
              <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:"1.9rem",fontWeight:700,color:"var(--ink)"}}>Statistiche</h1>
              <Statistics books={books}/>
            </div>
          )}

        </main>

        <div style={{
          position:"fixed",bottom:"6.5rem",right:"1.25rem",
          display:"flex",flexDirection:"column",gap:"0.5rem",alignItems:"flex-end",zIndex:100}}>
          <button onClick={()=>setOpenLibraryModal(true)} title="Aggiungi da Open Library"
            style={{width:48,height:48,borderRadius:"50%",
              background:"rgba(122,34,51,0.9)",border:"none",color:"#fff",fontSize:"1.2rem",
              cursor:"pointer",boxShadow:"0 2px 8px rgba(122,34,51,0.3)",
              display:"flex",alignItems:"center",justifyContent:"center"}}>
            🔍
          </button>
          <button onClick={()=>setModal("add")} style={{
            width:52,height:52,borderRadius:"50%",
            background:"var(--burgundy)",border:"none",
            color:"#fff",fontSize:"1.5rem",cursor:"pointer",
            boxShadow:"0 4px 16px rgba(122,34,51,0.4)",
            display:"flex",alignItems:"center",justifyContent:"center"}}>
            +
          </button>
        </div>

        <nav style={{
          position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",
          width:"100%",maxWidth:520,
          background:"var(--card-bg)",
          borderTop:"1px solid var(--border)",
          display:"flex",justifyContent:"space-around",alignItems:"center",
          padding:"0.5rem 0 0.65rem",
          paddingBottom:"calc(0.65rem + env(safe-area-inset-bottom))",
          boxShadow:"0 -2px 16px rgba(28,22,17,0.08)",
          zIndex:200,
        }}>
          {TABS.map(({id,label})=>(
            <button key={id} onClick={()=>setTab(id)} style={{
              background:"none",border:"none",cursor:"pointer",
              display:"flex",flexDirection:"column",alignItems:"center",gap:"0.15rem",
              padding:"0.1rem 0.6rem",flex:1,
              color:tab===id?"var(--burgundy)":"var(--muted)",
            }}>
              {TAB_ICONS[id]}
              <span style={{
                fontFamily:"'DM Mono',monospace",fontSize:"0.58rem",
                color:tab===id?"var(--burgundy)":"var(--muted)",
                letterSpacing:"0.02em",textAlign:"center",lineHeight:1.2,
              }}>{label}</span>
            </button>
          ))}
        </nav>

        <Modal open={!!modal} onClose={()=>{setModal(null);setOpenLibraryPreload(null);}}>
          <BookForm initial={modal&&modal!=="add"?modal:null} openLibraryData={openLibraryPreload} onSave={saveBook} onCancel={()=>{setModal(null);setOpenLibraryPreload(null);}}/>
        </Modal>
        <Modal open={openLibraryModal} onClose={()=>setOpenLibraryModal(false)}>
          <OpenLibrarySearchModal onSelectBook={handleOpenLibrarySelect} onClose={()=>setOpenLibraryModal(false)}/>
        </Modal>
        <Modal open={csvModal} onClose={()=>setCsvModal(false)}>
          <CsvImportModal existingBooks={books} onImport={handleCsvImport} onClose={()=>setCsvModal(false)}/>
        </Modal>
        {toast&&(
          <div style={{position:"fixed",bottom:"5rem",left:"50%",transform:"translateX(-50%)",
            background:"var(--ink)",color:"var(--cream)",padding:"0.75rem 1.5rem",borderRadius:12,
            fontFamily:"'Lora',serif",fontSize:"0.88rem",boxShadow:"0 8px 32px rgba(28,22,17,0.3)",zIndex:2000}}>
            {toast}
          </div>
        )}
      </div>
    </>
  );
}

if (splash) {
  setTimeout(() => {
    splash.style.opacity = "0";
    setTimeout(() => splash.remove(), 400);
  }, 600);
}
</script>
